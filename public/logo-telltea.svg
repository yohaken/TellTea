<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" fill="none" role="img" aria-label="Tell Tea">
  <!-- Mascot: young man + bubble tea (navy brand) -->
  <g stroke="#0077B6" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- short hair -->
    <path fill="#003B5C" d="M52 38c0-12 10-20 22-20 10 0 18 6 21 15-4 1-9 2-14 2-8 0-16-1-21-3 0 2-1 4-1 6z"/>
    <!-- ear -->
    <path fill="#003B5C" d="M48 52c-3 1-5 4-4 7 1 2 3 3 5 2"/>
    <!-- face -->
    <path fill="#003B5C" d="M54 40c-2 8-1 18 3 24 3 5 9 8 16 8 8 0 14-4 17-10 2-5 2-12 0-18-3-7-10-12-18-12-7 0-14 3-18 8z"/>
    <!-- eye -->
    <circle fill="#0077B6" cx="68" cy="54" r="2.4"/>
    <!-- smile -->
    <path fill="none" d="M62 64c3 3 8 4 12 2"/>
    <!-- neck + shoulders -->
    <path fill="#003B5C" d="M66 72c2 4 4 6 8 7 5 1 10-1 14-4 1 6 0 14-2 20-8 3-18 4-28 2-4-8-4-16-2-22 3 1 6 0 10-3z"/>
    <!-- cup -->
    <path fill="#003B5C" d="M108 42c0-7 5-12 12-12h30c7 0 12 5 12 12v28c0 11-9 20-20 20h-14c-11 0-20-9-20-20V42z"/>
    <!-- handle -->
    <path fill="none" d="M162 50c9 0 14 5 14 12s-5 12-14 12"/>
    <!-- straw -->
    <path fill="#003B5C" d="M128 28h7v22c0 2-1.5 3.5-3.5 3.5S128 52 128 50V28z"/>
    <!-- lid -->
    <path fill="none" d="M112 42h44"/>
    <!-- pearls -->
    <circle fill="#0077B6" cx="124" cy="68" r="3"/>
    <circle fill="#0077B6" cx="136" cy="72" r="3"/>
    <circle fill="#0077B6" cx="148" cy="68" r="3"/>
    <!-- steam -->
    <path fill="none" d="M118 34c4-6 8-8 14-6"/>
    <path fill="none" d="M130 26c2-6 6-9 11-9"/>
  </g>
  <text x="120" y="110" text-anchor="middle" fill="#003B5C" stroke="#0077B6" stroke-width="0.8" paint-order="stroke fill" font-family="Poppins, Montserrat, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">Tell Tea</text>
</svg>
