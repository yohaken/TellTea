name: Check nPos on-site devices (live specs)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/check-npos-devices-live.mjs"
      - ".github/workflows/check-npos-devices.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Dump live nPos device + diagnose specs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          POS_ONLINE_MS: "900000"
          OUT_DIR: artifacts/npos-onsite-devices
        run: |
          mkdir -p artifacts/npos-onsite-devices
          node scripts/check-npos-devices-live.mjs

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: npos-onsite-devices
          path: artifacts/npos-onsite-devices
          if-no-files-found: error
