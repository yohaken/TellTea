name: Void pending group salary (one-shot)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/void-pending-group-salary.mjs"
      - ".github/workflows/void-pending-group-salary.yml"

jobs:
  void:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Void pending salary_mid + salary_month_end
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APPLY: "1"
        run: node scripts/void-pending-group-salary.mjs
