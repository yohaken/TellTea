name: Mint owner QA custom token

on:
  workflow_dispatch:

jobs:
  mint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install firebase-admin
        run: npm install --no-save firebase-admin@13

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Mint token
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          QA_OWNER_EMAIL: yohaken@gmail.com
        run: node scripts/mint-owner-qa-token.mjs

      - name: Upload token artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-custom-token
          path: qa-custom-token.txt
          retention-days: 1
