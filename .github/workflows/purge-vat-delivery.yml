name: Purge VAT delivery totals

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Set to 1 to wipe for real (otherwise dry-run)"
        required: true
        default: "0"

jobs:
  purge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Purge delivery totals (+ old import rows)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APPLY: ${{ inputs.apply }}
        run: node scripts/purge-vat-delivery.mjs
