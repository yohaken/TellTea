name: Deploy TellTea to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      # Prefer modern Firebase Storage default — avoid custom hosting domains in secrets.
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: mypeer-501909.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      NEXT_PUBLIC_OWNER_EMAIL: yohaken@gmail.com
      TELLTEA_OT_STORAGE_BUCKET: mypeer-501909.firebasestorage.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need HEAD~1 for APP_BUILD / POS_BUILD bump guard
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Guard Firestore rules (block incomplete / wiped rules)
        run: npm run test:firestore-rules

      - name: Guard APP_BUILD / POS_BUILD bump when UI changes
        run: npm run test:app-build-bump

      - name: Build static export
        run: npm run build

      - name: Verify install page is in POS export (before APK)
        run: |
          test -f out-pos/install/index.html
          grep -q 'nPos-telltea.apk' out-pos/install/index.html

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build nPos-telltea Hello World APK
        run: |
          java -version
          cd npos-telltea
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK to POS hosting download path
        run: node scripts/publish-pos-apk.mjs

      - name: Verify back-office static routes
        run: npm run smoke:hosting

      - name: Verify standalone POS hosting export
        run: REQUIRE_POS_APK=1 npm run smoke:pos-hosting

      - name: Verify POS connectivity wiring
        run: npm run test:pos-connectivity

      - name: Verify POS sale transaction ordering
        run: npm run test:pos-complete-sale

      - name: Verify POS offline sync wiring
        run: npm run test:pos-sync

      - name: Verify POS menu + options wiring
        run: npm run test:pos-menu-cart

      - name: Verify POS unified receipt layout
        run: npm run test:pos-receipt-layout

      - name: Verify POS session chaos logic
        run: npm run test:pos-session-chaos

      - name: Verify POS e2e (Playwright — phase 1 + 3 chaos)
        run: |
          npx playwright install chromium
          npx --yes serve out-pos -l 8765 &
          sleep 3
          POS_E2E_URL=http://127.0.0.1:8765/pos/sell/ npm run test:pos-e2e-all

      - name: Enable POS auth domains
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/enable-pos-auth-domains.mjs
        continue-on-error: true

      - name: Enable anonymous sign-in (POS fallback)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/enable-anonymous-auth.mjs
        continue-on-error: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Verify + repair OT brew rates by shift date
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/repair-ot-bonus-rates.mjs

      - name: Install Cloud Functions deps
        run: npm ci
        working-directory: functions

      - name: Ensure Firebase Storage bucket
        id: ensure_bucket
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          OUT=$(node scripts/ensure-storage-bucket.mjs)
          echo "$OUT"
          NAME=$(echo "$OUT" | sed -n 's/^TELLTEA_STORAGE_BUCKET=//p' | tail -1)
          if [ -z "$NAME" ]; then
            NAME="mypeer-501909.appspot.com"
          fi
          echo "RESOLVED_STORAGE_BUCKET=$NAME" >> "$GITHUB_ENV"

      - name: Write Functions env
        run: |
          BUCKET="${RESOLVED_STORAGE_BUCKET:-mypeer-501909.appspot.com}"
          printf 'VAPID_PUBLIC_KEY=%s\nVAPID_PRIVATE_KEY=%s\nTELLTEA_STORAGE_BUCKET=%s\nGEMINI_API_KEY=%s\n' \
            "${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}" \
            "${{ secrets.VAPID_PRIVATE_KEY }}" \
            "$BUCKET" \
            "${{ secrets.GEMINI_API_KEY }}" > functions/.env
          echo "Wrote functions/.env TELLTEA_STORAGE_BUCKET=$BUCKET"

      - name: Ensure POS hosting site exists
        run: |
          npx firebase-tools@latest hosting:sites:create telltea-pos \
            --project mypeer-501909 --non-interactive 2>/dev/null || true

      - name: Deploy Hosting + Firestore + Storage + Functions
        run: |
          set +e
          # 1) Hosting ก่อน — ให้ UI/version ขึ้นได้แม้ rules API สะดุด
          npx firebase-tools@latest deploy --only hosting:telltea,hosting:telltea-pos --project mypeer-501909 --non-interactive --force
          host=$?
          if [ "$host" -ne 0 ]; then
            echo "Hosting deploy failed"
            exit "$host"
          fi

          # 2) Firestore rules — retry บน 503/unavailable ของ Rules API
          rules=1
          for attempt in 1 2 3 4; do
            echo "Firestore rules attempt $attempt"
            npx firebase-tools@latest deploy --only firestore --project mypeer-501909 --non-interactive --force
            rules=$?
            if [ "$rules" -eq 0 ]; then
              break
            fi
            sleep $((attempt * 8))
          done

          # 3) Storage (optional) + Functions
          npx firebase-tools@latest deploy --only storage --project mypeer-501909 --non-interactive --force
          storage=$?
          if [ "$storage" -ne 0 ]; then
            echo "WARN storage deploy skipped/failed"
          fi
          npx firebase-tools@latest deploy --only functions --project mypeer-501909 --non-interactive --force
          fn=$?

          if [ "$rules" -ne 0 ]; then
            echo "ERROR firestore rules failed after retries"
            exit "$rules"
          fi
          if [ "$fn" -ne 0 ]; then
            echo "ERROR functions deploy failed"
            exit "$fn"
          fi
          exit 0

      - name: Verify live install page + APK download
        run: node scripts/smoke-pos-install-live.mjs

      - name: Verify live shop + POS version.json matches this commit
        run: npm run smoke:live-version

      # one-shot channel proof was useful once; keep dedicated ping workflow instead
      # (avoids failing/noise on every deploy when tablets are idle)

  # Temporary: mint owner custom token when commit message contains [mint-qa-token]
  mint-qa-token:
    if: contains(github.event.head_commit.message, '[mint-qa-token]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install firebase-admin
        run: npm install --no-save firebase-admin@13

      - name: Mint token
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          QA_OWNER_EMAIL: yohaken@gmail.com
        run: node scripts/mint-owner-qa-token.mjs

      - name: Upload token artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-custom-token
          path: qa-custom-token.txt
          retention-days: 1

  # One-shot: backfill lastSeenAt from stock/prod/ot activity [repair-staff-presence]
  repair-staff-presence:
    if: contains(github.event.head_commit.message, '[repair-staff-presence]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Repair staff presence from activity
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/repair-staff-presence-from-activity.mjs

  # One-shot: dump staff lastSeenAt when commit message contains [dump-staff-presence]
  # Wait for repair job when both markers are present (avoid racing before backfill).
  dump-staff-presence:
    needs: [repair-staff-presence]
    if: |
      always()
      && contains(github.event.head_commit.message, '[dump-staff-presence]')
      && (needs.repair-staff-presence.result == 'success'
          || needs.repair-staff-presence.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Dump staff presence
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OUT_DIR: artifacts/staff-presence
        run: |
          mkdir -p artifacts/staff-presence
          node scripts/dump-staff-presence.mjs

      - name: Upload dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: staff-presence-dump
          path: artifacts/staff-presence
          retention-days: 3

