# Detect stale production Firestore rules (Rules API 503 drift).
name: Verify Firestore rules live

on:
  schedule:
    - cron: "0 3,15 * * *" # 10:00 / 22:00 Bangkok
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:firestore-rules
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Verify live rules match repo markers
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run verify:firestore-rules
